<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Study Enhancer</title>
    <link rel="stylesheet" href="blocker.css">
</head>
<body>

    <header class="brand-header">
        <h1>YT Study Enhancer</h1>
    </header>

    <main class="timer-container">
        <div class="mode-switchers">
            <div class="mode-indicator"></div>
            <button class="mode-btn active" data-time="1500" data-mode="pomodoro">pomodoro</button>
            <button class="mode-btn" data-time="300" data-mode="short">short break</button>
            <button class="mode-btn" data-time="900" data-mode="long">long break</button>
        </div>

        <div class="time-display">25:00</div>

        <div class="controls">
            <button id="start-btn" class="control-btn main-btn">start</button>
            <button id="reset-btn" class="control-btn icon-btn" title="Reset Timer">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
            
            <button id="timer-settings-btn" class="icon-btn" title="Timer Settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </main>

    <section class="music-player-container">
        <div class="player-card">
            <button class="collapse-btn" id="collapse-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="music-tab" data-tab="1">
            </div>

            <div class="music-tab active" data-tab="2">
                <iframe
                    src="https://open.spotify.com/embed/playlist/0vvXsWCC9xrXsKd4FyS8kM?theme=0"
                    width="100%"
                    height="352"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
                </iframe>
            </div>

            <div class="music-tabs">
                <span class="tab-dot" data-target="1"></span>
                <span class="tab-dot active" data-target="2"></span>
            </div>
        </div>
    </section>

    <footer class="settings-container">
        <button id="settings-btn" class="icon-btn settings-rotate" title="Background Settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </footer>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3>Choose Background</h3>
            <div id="bg-gallery" class="gallery">
                <div class="bg-option upload-btn" id="upload-trigger" title="Upload your own image">+</div>
            </div>
            <input type="file" id="bg-uploader" accept="image/*" style="display: none;">
            <button id="close-modal-btn" class="close-modal-btn">Close</button>
        </div>
    </div>

    <div id="timer-settings-modal" class="modal">
        <div class="modal-content timer-settings-content">
            <h3>Timer Settings</h3>
            
            <div class="timer-section">
                <h4>Durations (minutes)</h4>
                <div class="timer-inputs-grid">
                    <div class="timer-input-group">
                        <label for="pomodoro-input">Pomodoro</label>
                        <input type="number" id="pomodoro-input" value="25" min="1" max="60">
                    </div>
                    <div class="timer-input-group">
                        <label for="short-input">Short Break</label>
                        <input type="number" id="short-input" value="5" min="1" max="30">
                    </div>
                    <div class="timer-input-group">
                        <label for="long-input">Long Break</label>
                        <input type="number" id="long-input" value="15" min="1" max="60">
                    </div>
                </div>
            </div>

            <div class="timer-section">
                <h4>Behavior</h4>
                <div class="timer-options">
                    <label class="toggle-option">
                        <input type="checkbox" id="auto-switch" checked>
                        <span class="toggle-label">Auto-play next timer</span>
                    </label>
                </div>
            </div>

            <div class="timer-section">
                <h4>Preferred Break</h4>
                <div class="timer-options">
                    <select id="preferred-break">
                        <option value="short">Short Break</option>
                        <option value="long">Long Break</option>
                    </select>
                </div>
            </div>

            <button id="close-timer-modal" class="close-modal-btn">Save Changes</button>
        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-icon" id="trash-icon" title="Trash">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
        <div class="taskbar-icon" id="pomodoro-icon" title="Pomodoro">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="taskbar-icon" id="note-icon" title="Notes">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        </div>
    </div>

    <script src="blocker_ui.js"></script>
</body>
</html>
