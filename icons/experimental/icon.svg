<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- play body -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a5c"/>
      <stop offset=".55" stop-color="#ec2a2a"/>
      <stop offset="1" stop-color="#c50e1c"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c0a16"/>
      <stop offset="1" stop-color="#6e0610"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bodyShade" cx=".5" cy="1.1" r=".75">
      <stop offset="0" stop-color="#5a0008" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5a0008" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6ee"/>
    </linearGradient>

    <!-- cap -->
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a71a8"/>
      <stop offset=".45" stop-color="#3d4270"/>
      <stop offset="1" stop-color="#252945"/>
    </linearGradient>
    <linearGradient id="boardEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d2038"/>
      <stop offset=".5" stop-color="#2b2f52"/>
      <stop offset="1" stop-color="#14162a"/>
    </linearGradient>
    <linearGradient id="skull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141627"/>
      <stop offset=".45" stop-color="#2d3152"/>
      <stop offset="1" stop-color="#111322"/>
    </linearGradient>

    <!-- tassel -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe48a"/>
      <stop offset=".5" stop-color="#ffbf2e"/>
      <stop offset="1" stop-color="#d97f06"/>
    </linearGradient>
    <radialGradient id="knot" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff3c2"/>
      <stop offset=".5" stop-color="#ffc23a"/>
      <stop offset="1" stop-color="#c46f00"/>
    </radialGradient>

    <clipPath id="bodyClip"><rect x="12" y="44" width="104" height="68" rx="24"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="softSm" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <g filter="url(#drop)">
    <!-- body: extruded side, then face -->
    <rect x="12" y="50" width="104" height="68" rx="24" fill="url(#bodySide)"/>
    <rect x="12" y="44" width="104" height="68" rx="24" fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="12" y="44" width="104" height="68" fill="url(#bodyShade)"/>
      <!-- shadow cast by the cap onto the body -->
      <ellipse cx="64" cy="50" rx="44" ry="12" fill="#3a0006" opacity=".55" filter="url(#soft)"/>
      <!-- glossy top highlight -->
      <path d="M12 76 C34 70 94 70 116 76 V44 H12 Z" fill="url(#gloss)"/>
    </g>
    <rect x="13" y="45" width="102" height="66" rx="23" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>

    <!-- play triangle with a soft shadow -->
    <path d="M56 72 L56 102 L82 87 Z" fill="#7a0010" opacity=".55" stroke="#7a0010" stroke-width="7" stroke-linejoin="round" filter="url(#softSm)"/>
    <path d="M54 68 L54 98 L80 83 Z" fill="url(#play)" stroke="url(#play)" stroke-width="7" stroke-linejoin="round"/>

    <!-- cap skull -->
    <path d="M35 32 V50 C35 50 47 58 64 58 C81 58 93 50 93 50 V32 Z" fill="url(#skull)"/>
    <!-- board edge (thick, shaded) -->
    <path d="M11 34 L64 53 L117 34 V40 L64 59 L11 40 Z" fill="url(#boardEdge)"/>
    <!-- board top -->
    <path d="M64 15 L117 34 L64 53 L11 34 Z" fill="url(#board)"/>
    <!-- highlight on the upper-left bevel -->
    <path d="M11 34 L64 15 L117 34" fill="none" stroke="#d6daff" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M11 34 L64 53 L117 34" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- tassel cord shadow, cord, knot -->
    <path d="M64 35 L106 40 L106 57" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softSm)"/>
    <path d="M64 33 L106 38 L106 56" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="64" cy="35.5" rx="5.5" ry="2.5" fill="#000" opacity=".35" filter="url(#softSm)"/>
    <circle cx="64" cy="33" r="4.8" fill="url(#knot)"/>
    <!-- tassel: band + fringe with strands -->
    <rect x="102.2" y="53.5" width="7.6" height="4.5" rx="1.5" fill="#c46f00"/>
    <path d="M102.5 57.5 h7 l3.2 15 a6.7 6.7 0 0 1 -13.4 0 z" fill="url(#gold)"/>
    <path d="M104 60 L102.6 74 M106 60 V76 M108 60 L109.4 74" stroke="#b86400" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
